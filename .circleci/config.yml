jobs:
  finalInt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Vacuum DB
          command: |
            mkdir -p /tmp/root
            set +o pipefail 2>/dev/null; readarray a < <(seq 1 10000 | tr '\n' ' '); printf '%s' "${a[0]}" > /tmp/root/2018-10-03T14-46; true
            echo "stage:ensure-full-docker-image:bytes:$(wc -c </tmp/root/2018-10-03T14-46):hash:$(md5sum /tmp/root/2018-10-03T14-46 | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/root
          paths:
            - '2018-10-03T14-46'
  ensure-full-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/root
      - run:
          name: Load blob
          command: |
            od -c /tmp/root/2018-10-03T14-46 2>/dev/null | head -1 || true
      - run:
          name: Pull code
          command: git clone --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll vendor sources
          command: tar xf deps.tar
      - run:
          name: Smoke check
          command: sleep 60
      - run:
          no_output_timeout: 114m
          command: /bin/sh -c "./bin-main"
